<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Standards in local authorities</title>
<style>html,body{margin:0;background:#f4f1f6}body{padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}</style>
</head>
<body>
<!-- ============================================================
     CTSI Local Authority Insight | Trading Standards in local authorities
     Self-contained: no external scripts, fonts or data files.
     Host as index.html (e.g. GitHub Pages) and embed with an iframe.
     Boundaries: ONS (OGL v3), adjusted to April 2023 council structure. Data: CTSI.
     ============================================================ -->
<div id="ctsi-uk-host"><noscript>This interactive map needs JavaScript to display.</noscript></div>
<template id="ctsi-tpl">
<style>
:host{display:block}
.c{--purple:#5c3b67;--purple2:#7e5782;--purple3:#efe8f2;--green:#bfd740;--ink:#231a27;--muted:#6b6170;--line:#e6e0e9;--card:#fff;--bg:#f4f1f6;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.45;max-width:1320px;margin:0 auto;box-sizing:border-box;
  -webkit-user-select:none;user-select:none}
.c *,.c *::before,.c *::after{box-sizing:border-box}
.c h1,.c h2,.c h3,.c p{margin:0}
.c button{font:inherit;cursor:pointer}
.c input{-webkit-user-select:text;user-select:text}
.c :focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:20px;background:var(--purple);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--green);opacity:.18}
.logo{flex:none;height:64px;width:auto;background:#fff;border-radius:10px;padding:6px}
.kicker{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.top h1{font-size:1.85rem;line-height:1.15;font-weight:800;margin-top:2px}
.top p{opacity:.9;margin-top:6px;font-size:.95rem;max-width:760px}
.asat{flex:none;margin-left:auto;align-self:flex-start;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 12px;font-size:.8rem;white-space:nowrap;position:relative;z-index:1}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(35,26,39,.04)}
.sec{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--purple2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--green)}
.glance{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px;margin-bottom:16px}
.big{font-size:2rem;font-weight:800;color:var(--purple);line-height:1}
.big small{font-size:.85rem;font-weight:500;color:var(--muted);margin-left:6px}
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;margin-top:12px}
.run{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.run i{width:6px;align-self:stretch;border-radius:3px;flex:none}
.run b{display:block;font-size:1.35rem;line-height:1.1}
.run span{font-size:.78rem;color:var(--muted)}
.cap{font-size:.78rem;color:var(--muted);margin-top:10px}
.hbar{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:14px 0 10px;background:var(--line)}
.hbar span{display:block;height:100%}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:5px 18px;font-size:.84rem}
.keys span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keys div{display:flex;align-items:center;gap:7px;min-width:0}
.keys i{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.12)}
.keys em{font-style:normal;margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.keys u{text-decoration:none;color:var(--muted);font-size:.76rem;width:44px;flex:none;text-align:right}

/* map section */
.mapcard{margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.45rem;line-height:1.1;color:var(--purple)}
.stat span{font-size:.8rem;color:var(--muted)}
.ctls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin-bottom:12px}
.ctl{display:flex;flex-direction:column;gap:5px}
.lab{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;border-radius:8px;padding:6px 11px;font-size:.86rem;font-weight:600;color:var(--purple)}
.seg button:hover{background:#fff}
.seg button[aria-pressed="true"]{background:var(--purple);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg.big2 button{padding:8px 15px;font-size:.92rem}
.search{position:relative;flex:1 1 240px;max-width:340px;margin-left:auto}
.search input{width:100%;padding:8px 12px;border:1px solid #cfc5d4;border-radius:10px;font:inherit;font-size:.9rem;background:#fff}
.search ul{position:absolute;z-index:6;left:0;right:0;top:100%;margin:4px 0 0;padding:4px 0;list-style:none;background:#fff;border:1px solid #cfc5d4;border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 22px rgba(0,0,0,.14)}
.search li{padding:7px 12px;font-size:.88rem;cursor:pointer}
.search li small{color:var(--muted);margin-left:6px}
.search li[aria-selected="true"],.search li:hover{background:var(--purple3)}
.leg{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:6px}
.leg button{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 6px;font-size:.82rem;color:var(--ink)}
.leg button[aria-pressed="true"]{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple)}
.leg i{width:15px;height:15px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.leg em{font-style:normal;color:var(--muted)}
.legnote{font-size:.8rem;color:var(--muted);margin:2px 0 10px}
.main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:16px;align-items:start}
.mapbox{position:relative;background:linear-gradient(180deg,#fbfafc,#f5f2f7);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}
svg.map{display:block;width:100%;height:auto;cursor:default;touch-action:pan-y}
svg.map.zoomed{cursor:grab}
svg.map.dragging,svg.map.dragging path.a{cursor:grabbing}
.map path.a{stroke:#fff;stroke-width:.6;stroke-linejoin:round;cursor:pointer;transition:opacity .15s;vector-effect:non-scaling-stroke}
.map path.a.dim{opacity:.16}
.map path.a.hov{stroke:var(--ink);stroke-width:1.6}
.map path.a.sel{stroke:var(--ink);stroke-width:2.4}
.map path.a.partner{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 2}
.map path.a.ni{fill:#e7e2ea}
.map path.a.ni.dim{opacity:.45}
.frame{fill:#fff;stroke:var(--purple2);stroke-width:1;vector-effect:non-scaling-stroke}
.flabel{font-size:11px;font-weight:700;fill:var(--purple)}
.zoom{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);z-index:2}
.zoom button{width:34px;height:34px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--purple);font-size:1.2rem;font-weight:700;line-height:1;padding:0}
.zoom button:last-child{border-bottom:0;font-size:1rem}
.zoom button:hover{background:var(--purple3)}
.ztip{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(35,26,39,.85);color:#fff;padding:10px 16px;border-radius:10px;font-size:.92rem;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3;text-align:center}
.ztip.on{opacity:1}
.hint{font-size:.78rem;color:var(--muted);margin-top:6px;text-align:center}

/* details panel */
.panel{position:sticky;top:12px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-height:240px;max-height:calc(100vh - 24px);overflow:auto;background:#fff}
.panel h3{font-size:1.25rem;color:var(--purple);line-height:1.2;padding-right:22px}
.sub{color:var(--muted);font-size:.85rem;margin-top:3px}
.close{float:right;background:var(--bg);border:0;border-radius:50%;width:26px;height:26px;color:var(--muted);font-size:1.1rem;line-height:1;padding:0}
.ctrl{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 12px 6px 6px;border-radius:999px;font-weight:700;font-size:.9rem;background:var(--bg)}
.ctrl i{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
.seatbar{position:relative;margin:14px 0 6px}
.seatbar .hbar{margin:0;height:26px}
.maj{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.majl{font-size:.76rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px}
.seatgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 14px;font-size:.86rem}
.seatgrid div{display:flex;align-items:center;gap:7px;min-width:0}
.seatgrid i{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.12)}
.seatgrid span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seatgrid em{font-style:normal;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.vote{margin-top:14px;border-left:4px solid var(--green);background:#f7fadf;border-radius:0 10px 10px 0;padding:9px 12px;font-size:.88rem}
.vote b{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--purple2);margin-bottom:2px}
.panel dl{margin:0}
.panel dt{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--purple2);margin-top:14px}
.panel dd{margin:4px 0 0;font-size:.9rem;white-space:pre-line}
.panel dd a{color:var(--purple);word-break:break-word}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.pill i{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem;color:var(--purple)}
.chip:hover{border-color:var(--purple)}
.chip.fut{border-style:dashed}
.mini{display:block;margin-top:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:.84rem;white-space:normal}
.mini .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mini .nm{font-weight:700;color:var(--purple)}
.mini button.nm{background:none;border:0;padding:0;text-decoration:underline;text-align:left}
.mini .hbar{height:9px;margin:6px 0 4px;border-radius:4px}
.mini .meta{color:var(--muted);font-size:.78rem}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.figs div{background:var(--bg);border-radius:10px;padding:7px 9px;font-size:.76rem;color:var(--muted)}
.figs b{display:block;font-size:1.05rem;color:var(--purple)}
.mapimg{display:block;width:100%;height:auto;margin:6px 0 4px;border:1px solid var(--line);border-radius:8px;background:#fff}
.empty p{color:var(--muted);font-size:.9rem;margin-top:8px}
/* free preview */
.seg button.locked{color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button.locked svg{width:12px;height:12px;flex:none}
.seg button.locked:hover{background:#fff;color:var(--purple)}
.joinbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#f7fadf;border:1px solid #dfe9a8;border-left:5px solid var(--green);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:.92rem}
.joinbar[hidden]{display:none}
.joinbar p{flex:1 1 320px}
.join{display:inline-flex;align-items:center;gap:8px;background:var(--purple);color:#fff !important;text-decoration:none;font-weight:700;border-radius:10px;padding:9px 16px;font-size:.92rem;white-space:nowrap}
.join:hover{background:var(--purple2)}
.promo{margin-top:16px;border-radius:12px;background:var(--purple);color:#fff;padding:16px 18px}
.promo .k{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.promo h3{color:#fff;font-size:1.1rem;margin-top:2px;padding:0}
.promo p{font-size:.88rem;opacity:.92;margin-top:6px}
.promo ul{margin:10px 0 14px;padding-left:18px;font-size:.88rem}
.promo li{margin:3px 0}
.promo .join{background:var(--green);color:var(--ink) !important}
.promo .join:hover{background:#d3e86a}
.teaser{position:relative;margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.teaser .sk{padding:14px 16px;filter:blur(3px);opacity:.55;pointer-events:none}
.teaser .sk i{display:block;height:12px;border-radius:6px;background:#d9cfe0;margin:9px 0}
.teaser .sk i.b{height:24px;background:linear-gradient(90deg,#c9bcd1 0 38%,#e3dbe8 38% 62%,#bfb0c8 62% 80%,#e9e3ed 80%)}
.teaser .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:14px;background:rgba(255,255,255,.55)}
.teaser .ov b{color:var(--purple);font-size:.95rem}
.teaser .ov span{font-size:.82rem;color:var(--muted);max-width:300px}
.teaser .ov svg{width:22px;height:22px}

/* table */
details.tbl summary{cursor:pointer;font-weight:800;color:var(--purple);list-style:none;display:flex;align-items:center;gap:8px}
details.tbl summary::before{content:"+";display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--purple);color:#fff;font-weight:700}
details.tbl[open] summary::before{content:"\2212"}
.tscroll{overflow:auto;max-height:560px;margin-top:12px;border:1px solid var(--line);border-radius:10px}
.c table{border-collapse:collapse;width:100%;font-size:.84rem}
.c th,.c td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.c th{position:sticky;top:0;background:var(--purple);color:#fff;font-weight:600;white-space:nowrap;z-index:1}
.c th button{background:none;border:0;color:inherit;font-weight:inherit;padding:0}
.c tbody tr{cursor:pointer}
.c tbody tr:hover{background:var(--purple3)}
.c td .hbar{height:10px;margin:0;min-width:110px;border-radius:4px}
.c td.n{font-variant-numeric:tabular-nums;text-align:right}
.foot{margin:4px 4px 0;font-size:.78rem;color:var(--muted)}
.foot a{color:var(--purple)}

@media (max-width:900px){ .glance{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,1fr)} .search{max-width:none;margin-left:0;flex-basis:100%} }
@media (max-width:760px){ .main{grid-template-columns:1fr} .panel{position:static;max-height:none} }
@media (max-width:560px){ .top{flex-wrap:wrap} .top h1{font-size:1.45rem} .logo{height:46px} .asat{margin-left:0} .seatgrid{grid-template-columns:1fr} }
</style>

    var b=e.target.closest('[data-go]'); if(b) go(b.getAttribute('data-go'));
  });
  function select(key){ selected = key; if(key) promo = null; paint(); showPanel(); }
  function go(key){ var d=byKey[key]; if(!d) return;
    if(!d.ni && !inNation(d)){ nation='UK'; zoomTo('UK'); }
    if(!visible(d)){ selected = key; setView(d.kind==='fut' ? 'future' : 'today', true); }
    else refresh();
    select(key); }

  svg.addEventListener('mousemove', function(e){
    var k = e.target.__key || null;
    if(k!==hovered){ hovered=k; paint(); showPanel(); }
  });
  svg.addEventListener('mouseleave', function(){ if(hovered){ hovered=null; paint(); showPanel(); } });
  svg.addEventListener('click', function(e){ if(moved){ moved=false; return; } var k=e.target.__key; select(k && k!==selected ? k : null); });

  // ------------------------------------------------------------------ search --
  var ALL = D.concat(FUT), q=$('q'), ql=$('qlist'), hits=[], hi=-1;
  function closeList(){ ql.hidden=true; q.setAttribute('aria-expanded','false'); hi=-1; }
  function renderList(){
    ql.innerHTML = hits.map(function(d,i){ return '<li role="option" id="o'+i+'" data-go="'+esc(d.key)+'" aria-selected="'+(i===hi)+'">'+esc(d.n)+
      '<small>'+(d.kind==='fut' ? 'after reorganisation' : NATS[d.nat])+'</small></li>'; }).join('');
    ql.hidden = !hits.length; q.setAttribute('aria-expanded', String(!!hits.length));
    if(hi>=0) q.setAttribute('aria-activedescendant','o'+hi); else q.removeAttribute('aria-activedescendant');
  }
  q.addEventListener('input', function(){
    var s=q.value.trim().toLowerCase(); hi=-1;
    hits = s.length<2 ? [] : ALL.filter(function(d){ return d.n.toLowerCase().indexOf(s)>=0 ||
      (d.p||[]).some(function(p){ return p.toLowerCase().indexOf(s)>=0; }) ||
      (d.ds||[]).some(function(x){ return (typeof x==='string'?x:x[0]).toLowerCase().indexOf(s)>=0; }); }).slice(0,14);
    renderList();
  });
  q.addEventListener('keydown', function(e){
    if(ql.hidden) return;
    if(e.key==='ArrowDown'){ hi=Math.min(hi+1,hits.length-1); renderList(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ hi=Math.max(hi-1,0); renderList(); e.preventDefault(); }
    else if(e.key==='Enter'){ var d=hits[hi>=0?hi:0]; if(d){ pick(d.key); e.preventDefault(); } }
    else if(e.key==='Escape'){ closeList(); }
  });
  ql.addEventListener('mousedown', function(e){ var li=e.target.closest('li'); if(li){ e.preventDefault(); pick(li.getAttribute('data-go')); } });
  q.addEventListener('blur', function(){ setTimeout(closeList,100); });
  function pick(key){ q.value=byKey[key].n; closeList(); go(key);
    if(window.innerWidth<=760) $('panel').scrollIntoView({behavior:'smooth',block:'nearest'}); }

  ['copy','cut'].forEach(function(t){ sr.addEventListener(t, function(e){ if(e.target!==q) e.preventDefault(); }); });

  refresh();
  }
})();
</script>
